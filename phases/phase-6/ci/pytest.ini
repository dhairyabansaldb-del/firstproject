[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=phases/phase-4/backend/app
    --cov=phases/phase-5/backend/app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --html=phases/phase-6/tests/reports/html
    --self-contained-html
markers =
    unit: Unit tests
    integration: Integration tests
    smoke: Smoke tests
    slow: Slow running tests
    performance: Performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
